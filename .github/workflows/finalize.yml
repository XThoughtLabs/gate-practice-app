# The final verdict after the independent review (quality-gate CONTRACTS.md section 8.5, FN-3 to
# FN-6 and FN-9). A status event runs this file from the default branch, never from a PR. The work
# is done by quality-gate's reusable finalize at a full commit SHA, the same as the judge's; this
# file only calls it.
name: finalize

on: status

permissions: {}

jobs:
  finalize:
    # Exactly the reusable finalize's one job (FN-6): checks write, contents read, pull-requests read.
    # No contents: write, no actions: write. No secrets.
    permissions:
      checks: write
      contents: read
      pull-requests: read
    uses: XThoughtLabs/quality-gate/.github/workflows/finalize.yml@76ab28b940b0992f4a37c436b12b023ece4fcd52
    with:
      config-path: quality.toml
